name: CI

on:
  push:
  pull_request:

jobs:
  test-and-archive-scan:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Build sanitized source archive
        run: python scripts/make_source_zip.py PaperCompass_source.zip
      - name: Check source archive
        run: python scripts/check_source_archive.py PaperCompass_source.zip
      - name: Strict source archive check
        run: python scripts/check_source_archive.py --strict PaperCompass_source.zip
      - name: Test extracted source archive
        run: python scripts/test_source_archive.py PaperCompass_source.zip
